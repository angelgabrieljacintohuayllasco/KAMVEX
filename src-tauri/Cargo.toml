[package]
name = "kamvex"
version = "0.5.0"
description = "KAMVEX — local AI workspace: llama.cpp inference + DASA/SHARD anti-hallucination RAG"
authors = ["Angel Gabriel Jacinto Huayllasco"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kamvex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
reqwest = { version = "0.12", features = ["blocking"] }
zip = "4"


[features]
# Sin esta feature, `cargo build --release` produce un binario que sigue pidiendo el
# servidor de desarrollo (devUrl) en vez de servir `dist/` empotrado. La plantilla de
# Tauri la trae; aquí faltaba y por eso la app compilada mostraba ERR_CONNECTION_REFUSED.
custom-protocol = ["tauri/custom-protocol"]
